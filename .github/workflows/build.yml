name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew assembleDebug -PtomtomApiKey=""
