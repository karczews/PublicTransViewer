name: Build

on:
  workflow_call:
    secrets:
      TOMTOM_API_KEY:
        required: false
        description: "TomTom API key injected as Gradle project property"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew assembleDebug
        env:
          ORG_GRADLE_PROJECT_tomtomApiKey: ${{ secrets.TOMTOM_API_KEY }}
